- slug: renal-analysis
  title: Automated renal analysis
  summary: >-
    Convolutional models for hydronephrosis detection and kidney segmentation
    on ultrasound, with RWTH Uniklinik.
  kicker: February 2024
  card_label: Renal
  featured: false
  group: earlier
  date_display: Project September 2022 · paper February 2024
  location: Aachen, Germany
  project_type: Computer vision
  publication: renal
  local_video: ""
  video_path: assets/videos/renal-analysis.mp4
  role: Co-author. The work was done with RWTH Uniklinik.
  paragraphs:
    - >-
      Published as “Harnessing Artificial Intelligence for Enhanced Renal
      Analysis: Automated Detection of Hydronephrosis and Precise Kidney
      Segmentation,” European Urology Open Science, February 2024.
  sections:
    - heading: Background and objective
      text: >-
        Hydronephrosis is essential in the diagnosis of renal colic. We
        automated the detection of hydronephrosis from ultrasound images to
        standardize the therapy and reduce the misdiagnosis of renal colic.
    - heading: Methods
      text: >-
        Anonymously collected ultrasound images of human kidneys, both normal
        and hydronephrotic, were preprocessed for neural networks. Six
        “state of the art” models were trained and cross-validated for the
        detection of hydronephrosis, and two convolutional networks were used
        for kidney segmentation. In the testing phase, performance metrics
        included true positives, true negatives, false positives, false
        negatives, accuracy, and F1 score, while the evaluation of the
        segmentation task involved accuracy, precision, dice, jaccard, recall,
        and ASSD.
    - heading: Key findings and limitations
      text: >-
        A total of 523 sonographic kidney images (423 nonhydronephrotic and
        100 hydronephrotic) were collected from three different ultrasound
        devices. After training on this dataset, all models were used to
        evaluate 200 new ultrasound kidney images (142 nonhydronephrotic and
        58 hydronephrotic kidneys). The highest validation accuracy (98.5%)
        was achieved by the AlexNet model (GoogLeNet 97%, AlexNet_v2 96%,
        ResNet50 96%, ResNet101 97.5%, and ResNet152 95%). The
        deeplabv3_resnet50 and deeplabv3_resnet101 models reached a dice
        coefficient of 94.74% and 94.48%, respectively, on automated kidney
        segmentation. The study is limited by analyzing only hydronephrosis,
        but this specific focus enabled high detection accuracy.
    - heading: Conclusions and clinical implications
      text: >-
        We show that our automated ultrasound deep learning model can be
        trained and used to interpret and segmentate ultrasound images from
        different sources with high accuracy. This method will serve as an
        automated tool in the diagnostic algorithm of acute renal failure in
        the future.
    - heading: Patient summary
      text: >-
        Hydronephrosis is crucial in the diagnosis of renal colic. Recent
        advances in artificial intelligence allow automated detection of
        hydronephrosis in ultrasound images with high accuracy. These methods
        will help standardize the diagnosis and treatment of renal colic.
  links:
    - label: Paper
      status: ok
      url: https://doi.org/10.1016/j.euros.2024.01.017
    - label: PubMed
      status: ok
      url: https://pubmed.ncbi.nlm.nih.gov/38585207/
    - label: Code
      status: todo
      note: no public repository is known
