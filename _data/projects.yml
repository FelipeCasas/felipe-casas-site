- slug: multigrippergrasp
  title: MultiGripperGrasp
  summary: >-
    30.4 million Isaac Sim grasps for 11 grippers and 345 objects, with
    palm alignment so grasps can transfer across grippers.
  kicker: IROS 2024
  card_label: MGG
  featured: true
  group: dexterous
  date_display: March 2024 · IROS 2024
  location: University of Texas at Dallas
  project_type: Intelligent robotics, robotic grasping
  publication: multigrippergrasp
  local_video: ""
  video_path: assets/videos/multigrippergrasp.mp4
  role: Co-first author with Ninad Khargonkar (equal contribution).
  paragraphs:
    - >-
      MultiGripperGrasp is a large-scale dataset for robotic grasping. It
      contains 30.4 million grasps from 11 grippers for 345 objects. The
      grippers run from two-finger grippers to five-finger grippers, including
      a human hand. Every grasp is verified in Isaac Sim and labeled successful
      or unsuccessful. The object fall-off time is stored as a grasp-quality
      measurement. The grippers are aligned by palm orientation and position,
      which makes it possible to transfer a grasp from one gripper to another.
      That transfer increases the number of successful grasps for each gripper.
      The dataset is meant for generalized grasp planning and for studying
      grasp transfer.
    - >-
      The paper was presented at IROS 2024. A separate project page on this
      site covers the February 2025 evaluation toolkit built on the same code
      repository.
  links:
