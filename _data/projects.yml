- slug: robotfingerprint
  title: "RobotFingerPrint"
  summary: >-
    A shared spherical coordinate space and a conditional VAE for
    multi-gripper grasp synthesis, including zero-shot transfer to unknown
    hands.
  kicker: IROS 2025
  card_label: RFP
  featured: true
  group: dexterous
  date_display: arXiv 2024 · IROS 2025
  location: Dallas, TX
  project_type: Robotic grasping
  publication: robotfingerprint
  local_video: ""
  video_path: assets/videos/robotfingerprint.mp4
  role: Co-author. I presented the poster at TEROS 2026.
  paragraphs:
    - >-
      RobotFingerPrint introduces a representation called the unified gripper
      coordinate space for grasp synthesis across multiple grippers. The space
      is a 2D surface of a sphere in 3D, using longitude and latitude, and it
      is shared by all of the grippers. An algorithm maps the palm surface of
      a gripper into that space. A conditional variational autoencoder predicts
      unified gripper coordinates for an input object. Those coordinates set
      up correspondences between the gripper and the object, which an
      optimization then turns into a grasp pose and finger joints. Using the
      shared space improves success rate and diversity for grasp synthesis
      across grippers.
    - >-
      The arXiv preprint is from 2024. The conference version, whose title
      adds “and Transfer,” was published at IROS 2025. I presented a poster
      at TEROS 2026 (Texas Robotics) on April 4, 2026.
  links:
    - label: Paper
      status: ok
      url: https://arxiv.org/abs/2409.14519
    - label: Project page
      status: ok
      url: https://irvlutd.github.io/RobotFingerPrint/
    - label: Code
      status: ok
      url: https://github.com/IRVLUTD/robot-finger-print
