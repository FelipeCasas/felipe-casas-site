- slug: uhas
  title: "UHAS: Unified Hand Action Space"
  summary: >-
    One reinforcement-learning policy controls different dexterous hands
    through deformations of a canonical sphere, mapped by Cascade Inverse
    Kinematics.
  kicker: RSS 2026
  card_label: UHAS
  featured: true
  group: dexterous
  date_display: "2026"
  location: University of Texas at Dallas
  project_type: Dexterous manipulation
  publication: uhas
  local_video: ""
  video_path: assets/videos/uhas.mp4
  role: >-
    First author of the workshop paper and of the project release. I announced
    the method, the RSS 2026 presentation, the Wuji Hand addition, and the
    live visualization.
  paragraphs:
    - >-
      Robot manipulation policies are typically tied to specific robotic hand
      embodiments, limiting the transfer of learned behaviors across platforms
      with different kinematic structures. UHAS is a sphere-based unified
      action representation for cross-embodiment dexterous manipulation. It
      represents hand actions as geometric deformations of a canonical sphere
      and uses a Cascade Inverse Kinematics (CIK) algorithm to map that shared
      representation to embodiment-specific joint configurations. Policies are
      trained with reinforcement learning, directly in this action space, on
      in-hand cube reorientation. The paper evaluates the method in simulation
      and on hardware across the Allegro Hand, LEAP Hand, Shadow Hand, and
      MANO human hand, including zero-shot transfer to unseen hands, rapid
      finetuning, and real-world deployment.
    - >-
      The public thread adds a few concrete pieces around that result. The
      policy outputs sphere deformations. Automatic URDF analysis builds the
      canonical sphere and dense surface correspondences. Driving planes
      (changes in angle) and driving vectors (changes in radius) are
      interpolated, and the same deformation produces coordinated poses across
      hands. Cascade IK runs at up to 150 Hz. Zero-shot cases in the thread
      include a single hand, a joint failure, unseen hands, and a jump between
      four-finger and five-finger morphology. Real-robot clips show in-hand
      cube reorientation on a LEAP Hand and an Allegro Hand. The repository is
      set up so another hand can be added by following the guides. On July 11,
      2026 a Wuji Hand was added to the training set that way. On September 17,
      2026 a live visualization let a driving plane be dragged so Allegro,
      LEAP, Shadow, MANO, and Wuji moved together.
    - >-
      The paper was accepted and presented at the 4th Workshop on Dexterous
      Manipulation at Robotics: Science and Systems (RSS), 2026.
  links:
