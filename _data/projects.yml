- slug: digital-twin
  title: "Experimental digital twin for job shops"
  summary: >-
    Unity ML-Agents environment for multi-agent scheduling and transport in
    flexible assembly shops. The learned agents beat priority dispatching
    rules.
  kicker: LION 2023
  card_label: Digital twin
  featured: false
  group: earlier
  date_display: Thesis December 2022 · LION 2023
  location: Aachen, Germany
  project_type: Reinforcement learning, job-shop scheduling with transportation
  publication: digital-twin
  local_video: ""
  video_path: assets/videos/digital-twin.mp4
  role: >-
    Master's thesis. Co-author of the LION 2023 paper; the paper’s author
    list begins with A. Gannouni.
  paragraphs:
    - >-
      Factories are dealing with high product customization, more complex
      products, and shorter lead times, so they need flexible assembly systems.
      In those systems the shop-floor layout and the job schedule both have
      to be redone often. Job-shop scheduling and layout planning are
      NP-hard. Reinforcement learning has beaten several of the methods it has
      been compared with, but many training environments still treat today’s
      flexible assembly system as static.
    - >-
      This thesis proposes a configurable environment for optimizing flexible
      assembly with multiple reinforcement-learning agents, so agents can be
      trained quickly under different layouts and different job-shop instances.
      The environment is built in the Unity simulator with the Unity ML-Agents
      toolkit. An RL method was trained on several configurations and then
      tested for agent scalability, job scalability, job-shop scalability, and
      behavior under different shop-floor layouts.
    - >-
      Priority dispatching rules were implemented in the same environment.
      The trained agents outperformed every rule they were compared with.
      The environment’s visualization also made agent behavior inspectable:
      while assembling products, the agents showed noticeable preferences
      among actions.
  links:
    - label: Paper
      status: ok
      url: https://doi.org/10.1007/978-3-031-44505-7_25
    - label: Code
      status: todo
      note: no public repository is known
